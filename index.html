<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rutina de Gym Semanal</title>

  <!-- Configuración PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#e8541e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GymRutina">

  <style>
    /* ===== COLORES ===== */
    :root {
      --bg:   #f6f7f9;
      --card: #ffffff;
      --tx:   #1b1f27;
      --mu:   #5d6675;
      --ac:   #e8541e;
      --bd:   #e3e6eb;
      --sv:   #fdeee7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:   #14171c;
        --card: #1e232b;
        --tx:   #eef0f4;
        --mu:   #9aa3b2;
        --ac:   #ff7a45;
        --bd:   #2d343f;
        --sv:   #2a2420;
      }
    }

    /* ===== BASE ===== */
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body {
      margin: 0;
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
      background: var(--bg);
      color: var(--tx);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    header, .modes, nav, main { max-width: 820px; margin: auto; }
    header { padding: 28px 16px 8px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    h1 { margin: 0; font-size: 1.8rem; }
    header p { margin: 4px 0 0; color: var(--mu); }
    h2 { font-size: 1.25rem; margin: 18px 0 12px; }
    main { padding: 0 16px 40px; }

    /* ===== BOTÓN INSTALAR APP ===== */
    #btnInstalar {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--ac);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(232, 84, 30, 0.3);
      transition: transform 0.2s, opacity 0.2s;
      flex-shrink: 0;
    }
    #btnInstalar:hover {
      transform: translateY(-2px);
    }

    /* ===== FONDO CON IMAGEN ===== */
    :root {
      --fondo-img: url("https://i.pinimg.com/736x/68/5c/cf/685ccffac1a57a471e8e326e88202cc4.jpg");
      --fondo-size: cover;
      --fondo-repeat: no-repeat;
      --fondo-opacidad: .14;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fondo-opacidad: .22; }
    }
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      height: 100lvh;
      z-index: -1;
      background-image: var(--fondo-img);
      background-size: var(--fondo-size);
      background-repeat: var(--fondo-repeat);
      background-position: center;
      opacity: var(--fondo-opacidad);
      pointer-events: none;
    }

    /* ===== BOTONES ===== */
    .modes { display: flex; gap: 8px; padding: 10px 16px 0; }
    nav    { display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto; }
    .modes button, nav button {
      flex: 0 0 auto;
      border: 1px solid var(--bd);
      background: var(--card);
      color: var(--tx);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: .9rem;
      cursor: pointer;
    }
    .modes button.on, nav button.on {
      background: var(--ac);
      color: #fff;
      border-color: var(--ac);
    }
    nav button.rest-day { opacity: .75; }

    /* ===== NIVELES DE ENTRENAMIENTO ===== */
    .levels { flex-wrap: wrap; }
    .nivel-info { max-width: 820px; margin: 0 auto; padding: 10px 16px 0; }
    .nivel-card {
      background: var(--card);
      border: 1px solid var(--bd);
      border-left: 4px solid var(--ac);
      border-radius: 14px;
      padding: 12px 14px;
    }
    .nivel-card h3 { margin: 0 0 8px; font-size: 1.05rem; }
    .nivel-card h3 small { font-weight: 400; font-size: .82rem; color: var(--mu); }
    .nivel-card p { margin: 4px 0; font-size: .9rem; color: var(--mu); }
    .nivel-card b { color: var(--tx); }

    /* ===== TARJETA DE EJERCICIO ===== */
    .ex {
      display: grid;
      grid-template-columns: 170px 1fr;
      gap: 14px;
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }
    .ex:hover {
      transform: translateY(-2px);
      border-color: var(--ac);
    }
    .pic svg, .pic img {
      width: 170px;
      height: 140px;
      border-radius: 10px;
      display: block;
    }
    .pic svg { background: var(--sv); color: var(--ac); }
    .pic img { object-fit: cover; }

    .ex h3 { margin: 0 0 4px; font-size: 1.05rem; }
    .ex p  { margin: 4px 0; font-size: .92rem; color: var(--mu); }
    .ex b  { color: var(--tx); }
    .ex ol { margin: 4px 0 0; padding-left: 18px; font-size: .9rem; color: var(--mu); }
    .tag {
      display: inline-block;
      background: var(--sv);
      color: var(--ac);
      font-size: .78rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 6px;
      margin: 0 6px 6px 0;
    }

    /* ===== MODAL / ZOOM (IMAGEN COMPLETA SIN RECORTES) ===== */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 16px;
      backdrop-filter: blur(6px);
    }
    .modal-overlay.active { display: flex; }
    .modal-card {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 20px;
      padding: 20px;
      max-width: 600px;
      width: 100%;
      max-height: 92vh;
      overflow-y: auto;
      position: relative;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      animation: zoomIn 0.25s ease-out;
    }
    @keyframes zoomIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-close {
      position: absolute;
      top: 15px; right: 15px;
      background: var(--sv);
      color: var(--ac);
      border: none;
      width: 38px; height: 38px;
      border-radius: 50%;
      font-weight: bold;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      z-index: 10;
    }
    .modal-card .pic {
      margin-bottom: 16px;
      background: var(--sv);
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .modal-card .pic img, .modal-card .pic svg {
      width: 100% !important;
      height: auto !important;
      max-height: 380px !important;
      object-fit: contain !important;
      border-radius: 12px;
      background: rgba(0,0,0,0.03);
    }

    /* ===== DÍA DE DESCANSO ===== */
    .rest {
      overflow: hidden;
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 18px;
    }
    .rest-hero {
      height: 190px;
      background: linear-gradient(135deg, #1f2a44, #3b2f63 60%, var(--ac));
    }
    .rest-hero svg, .rest-hero img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }
    .rest-body { padding: 22px 20px 24px; text-align: center; }
    .rest-body h3 { margin: 0 0 6px; font-size: 1.35rem; }
    .rest-body > p { margin: 0; color: var(--mu); }
    .rest-tips {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 18px;
      text-align: left;
    }
    .tip {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--sv);
      border-radius: 12px;
      padding: 10px 12px;
    }
    .tip .ic { font-size: 1.6rem; }
    .tip b    { display: block; font-size: .92rem; }
    .tip span { font-size: .8rem; color: var(--mu); }

    /* ===== PC / TABLET ANCHO ===== */
    @media (min-width: 1000px) {
      header, .modes, nav, main, .nivel-info { max-width: 1100px; }
      main {
        display: grid;
        grid-template-columns: 1fr 1fr;
        column-gap: 16px;
        align-items: start;
      }
      main > h2, main > .rest { grid-column: 1 / -1; }
    }

    /* ===== MÓVIL HORIZONTAL ===== */
    @media (max-height: 480px) and (orientation: landscape) {
      header { padding-top: 12px; }
      h1 { font-size: 1.4rem; }
      .rest-hero { height: 120px; }
    }

    /* ===== MÓVIL ===== */
    @media (max-width: 560px) {
      .ex { grid-template-columns: 1fr; }
      .pic svg, .pic img { width: 100%; }
      .rest-tips { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <header>
    <div>
      <h1>🏋️ Rutina de Gym Semanal</h1>
      <p>6 Días de Alta Frecuencia (Sin Descanso hasta el Domingo)</p>
    </div>
    <button id="btnInstalar" aria-label="Instalar Aplicación">
      📲 Instalar App
    </button>
  </header>

  <div class="modes">
    <button id="btnDia" class="on">Por día</button>
    <button id="btnSemana">Semana completa</button>
  </div>
  <div class="modes levels" id="levels" aria-label="Nivel de entrenamiento"></div>
  <section class="nivel-info" id="nivelInfo"></section>
  <nav id="nav"></nav>
  <main id="main"></main>

  <!-- MODAL ZOOM CON IMAGEN COMPLETA -->
  <div id="modalOverlay" class="modal-overlay">
    <div id="modalContainer" class="modal-card">
      <button class="modal-close" id="modalClose">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
    /* ===== REGISTRO SERVICE WORKER (PWA) ===== */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch((err) => console.warn('SW no registrado:', err));
      });
    }

    /* ===== MANEJO DE INSTALACIÓN PWA ===== */
    let deferredPrompt;
    const btnInstalar = document.getElementById('btnInstalar');

    // Si ya se abrió como app instalada, ocultamos el botón
    const yaInstalada = window.matchMedia('(display-mode: standalone)').matches
                     || window.navigator.standalone === true;
    if (yaInstalada) btnInstalar.style.display = 'none';

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    function instruccionesInstalar() {
      const ua = navigator.userAgent;
      const esIOS = /iphone|ipad|ipod/i.test(ua);
      const esAndroid = /android/i.test(ua);
      const esMovil = esIOS || esAndroid;
      let titulo, pasos;

      if (esIOS) {
        titulo = 'Instalar en iPhone / iPad';
        pasos = [
          'Abre esta página en <b>Safari</b> (no funciona desde Chrome ni desde otras apps).',
          'Toca el botón <b>Compartir</b> (el cuadrado con la flecha hacia arriba).',
          'Baja y elige <b>"Añadir a pantalla de inicio"</b>.',
          'Toca <b>Añadir</b>. ¡Listo, ya tienes el ícono!'
        ];
      } else if (esAndroid) {
        titulo = 'Instalar en Android';
        pasos = [
          'Abre esta página en <b>Chrome</b>.',
          'Toca el menú <b>⋮</b> (tres puntos arriba a la derecha).',
          'Elige <b>"Instalar aplicación"</b> o <b>"Añadir a pantalla de inicio"</b>.',
          'Confirma con <b>Instalar</b>.'
        ];
      } else {
        titulo = 'Instalar en PC';
        pasos = [
          'Usa <b>Chrome</b> o <b>Edge</b>.',
          'Busca el ícono de instalar <b>⊕</b> a la derecha de la barra de direcciones.',
          'También puedes ir al menú <b>⋮</b> → <b>"Instalar Rutina de Gym Semanal"</b>.',
          'Confirma con <b>Instalar</b>.'
        ];
      }

      const aviso = (location.protocol === 'http:' && location.hostname !== 'localhost')
        ? '<p style="color:var(--ac);font-weight:600;">⚠️ Esta página está en HTTP. Para poder instalarla debe estar publicada con HTTPS (Netlify, GitHub Pages, etc.).</p>'
        : (location.protocol === 'file:'
          ? '<p style="color:var(--ac);font-weight:600;">⚠️ Abriste el archivo directo desde tu dispositivo. Para instalarla debes subirla a un hosting con HTTPS (Netlify, GitHub Pages, etc.).</p>'
          : '');

      modalBody.innerHTML = `
        <div style="text-align:left;">
          <h2 style="margin-top:0;font-size:1.3rem;">📲 ${titulo}</h2>
          ${aviso}
          <ol style="padding-left:20px;font-size:.95rem;color:var(--mu);">
            ${pasos.map(p => `<li style="margin-bottom:8px;">${p}</li>`).join('')}
          </ol>
        </div>`;
      modalOverlay.classList.add('active');
    }

    btnInstalar.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') btnInstalar.style.display = 'none';
        deferredPrompt = null;
      } else {
        instruccionesInstalar();
      }
    });

    window.addEventListener('appinstalled', () => {
      btnInstalar.style.display = 'none';
      deferredPrompt = null;
    });

    const REPS = {
      principiante: { '8-10': '10-12', '10': '12', '10-12': '12-15', '12': '12', '12-15': '15', '15': '15' },
      avanzado:     { '8-10': '6-8',   '10': '8',  '10-12': '8-10',  '12': '10', '12-15': '10-12', '15': '12-15' }
    };

    let nivel = 'intermedio';
    try {
      const guardado = localStorage.getItem('nivelGym');
      if (NIVELES[guardado]) nivel = guardado;
    } catch (e) {}

    function seriesNivel(texto) {
      const m = texto.match(/^(\d+) × ([\d-]+)(.*)$/);
      if (!m || nivel === 'intermedio' || texto.includes('min')) return texto;
      const series = Math.min(5, Math.max(2, +m[1] + NIVELES[nivel].delta));
      const reps = REPS[nivel][m[2]] || m[2];
      return `${series} × ${reps}${m[3]}`;
    }

    function renderNivel() {
      const n = NIVELES[nivel];
      [...document.getElementById('levels').children]
        .forEach(b => b.classList.toggle('on', b.dataset.nivel === nivel));
      document.getElementById('nivelInfo').innerHTML = `
        <div class="nivel-card">
          <h3>${n.icono} ${n.nombre} <small>· ${n.para}</small></h3>
          <span class="tag">Series: ${n.series}</span>
          <span class="tag">Descanso entre series: ${n.descanso}</span>
          <p><b>Intensidad:</b> ${n.intensidad}</p>
          <p><b>Consejo:</b> ${n.consejo}</p>
        </div>`;
    }

    function htmlImagen(ej) {
      const dibujo = DIBUJOS[ej.dibujo] || '';
      if (!ej.img) return dibujo;
      const respaldo = dibujo.replace(/"/g, '&quot;');
      return `<img src="${ej.img}" alt="${ej.nombre}" loading="lazy" onerror="this.outerHTML='${respaldo}'">`;
    }

    function htmlEjercicio(ej) {
      return `
        <div class="ex" onclick='abrirZoom(${JSON.stringify(ej).replace(/'/g, "&#39;")})'>
          <div class="pic">${htmlImagen(ej)}</div>
          <div>
            <h3>${ej.nombre}</h3>
            <span class="tag">${ej.musculo}</span>
            <span class="tag">${seriesNivel(ej.series)}</span>
            <p><b>¿Para qué sirve?</b> ${ej.sirve}</p>
            <p><b>Cómo se usa:</b></p>
            <ol>${ej.pasos.map(p => `<li>${p}</li>`).join('')}</ol>
          </div>
        </div>`;
    }

    /* MODAL ZOOM CON AJUSTE DE IMAGEN COMPLETA */
    const modalOverlay = document.getElementById('modalOverlay');

    function abrirZoom(ej) {
      modalBody.innerHTML = `
        <div style="text-align: left;">
          <div class="pic" style="margin-bottom: 16px;">${htmlImagen(ej)}</div>
          <h2 style="margin-top: 0; font-size: 1.3rem;">${ej.nombre}</h2>
          <div>
            <span class="tag">${ej.musculo}</span>
            <span class="tag">${seriesNivel(ej.series)}</span>
          </div>
          <p style="margin-top: 12px;"><b>¿Para qué sirve?</b> ${ej.sirve}</p>
          <p style="margin-top: 8px;"><b>Cómo se usa:</b></p>
          <ol style="padding-left: 20px; font-size: 0.95rem; color: var(--mu);">${ej.pasos.map(p => `<li style="margin-bottom: 6px;">${p}</li>`).join('')}</ol>
        </div>
      `;
      modalOverlay.classList.add('active');
    }

    function cerrarZoom() {
      modalOverlay.classList.remove('active');
    }

    modalClose.onclick = cerrarZoom;
    modalOverlay.onclick = (e) => {
      if (e.target === modalOverlay) cerrarZoom();

    function dibujar() {
      renderNivel();
      document.getElementById('btnDia').classList.toggle('on', modo === 'dia');

      nav.style.display = modo === 'dia' ? 'flex' : 'none';

    });

    document.getElementById('btnDia').onclick    = () => { modo = 'dia';    dibujar(); };
    document.getElementById('btnSemana').onclick = () => { modo = 'semana'; dibujar(); };

    Object.keys(NIVELES).forEach(k => {
      const b = document.createElement('button');
      b.dataset.nivel = k;
      b.textContent = NIVELES[k].icono + ' ' + NIVELES[k].nombre;
      b.onclick = () => {
        nivel = k;
        try { localStorage.setItem('nivelGym', k); } catch (e) {}
        dibujar();
      };
      document.getElementById('levels').appendChild(b);
    });

    dibujar();
  </script>
</body>
</html>
